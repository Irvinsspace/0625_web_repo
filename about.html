        <h1>關於我</h1>
        <p>我喜歡透過畫筆表達自己的情感、閱讀，喜歡旅行，也喜歡在遊戲中探索不同的世界觀和故事情節。
        我熱愛所有能幫助我獲取知識和靈感的事物，因為這些喜好都能成為我一路上認識自己的過程中很重要的一個途徑。
        無論是創作還是閱讀，都能夠讓我去看見更多的想法和可能性，懂得如何去思考更多層面的事情，能夠讓自己不斷成長和進步。
        </p>
