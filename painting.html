    <!-- 這是點擊後才會跑出來的「放大預覽區 (Lightbox)」 -->
    <div id="lightbox" class="lightbox">
        <span class="close-btn">&times;</span>
        <!-- 多包一層 wrapper 讓我們可以排版圖片和底下的文字 -->
        <div class="lightbox-wrapper">
            <img id="lightbox-img" src="" alt="放大預覽" oncontextmenu="return false;" draggable="false">
            <!-- 這是用來顯示白色介紹文字的地方 -->
            <p id="lightbox-text" class="lightbox-text"></p>
        </div>
    </div>

    <!-- 這一小段 JavaScript 負責控制點擊放大的魔法 -->
<script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxText = document.getElementById('lightbox-text'); // 🌟 新增：抓取用來放文字的 P 標籤
    const images = document.querySelectorAll('.polaroid');
    const closeBtn = document.querySelector('.close-btn');

    // 當點擊小圖時，打開黑底背景並替換大圖與文字
    images.forEach(img => {
        img.addEventListener('click', function() {
            lightbox.style.display = 'flex';
            lightboxImg.src = this.src;
            // 🌟 新增：讀取你在 HTML 寫的 data-text 屬性，如果沒寫就預設為空
            lightboxText.innerText = this.getAttribute('data-text') || ''; 
        });
    });

    // 點擊右上角叉叉關閉
    closeBtn.addEventListener('click', function() {
        lightbox.style.display = 'none';
    });

    // 點擊黑色背景任何一處也能關閉（現在還要確保點到文字也不會關閉）
    lightbox.addEventListener('click', function(e) {
        if (e.target !== lightboxImg && e.target !== lightboxText) {
            lightbox.style.display = 'none';
        }
    });
</script>
