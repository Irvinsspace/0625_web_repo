    <!-- 這是點擊後才會跑出來的「放大預覽區 (Lightbox)」 -->
    <div id="lightbox" class="lightbox">
        <span class="close-btn">&times;</span>
        <!-- 多包一層 wrapper 讓我們可以排版圖片和底下的文字 -->
        <div class="lightbox-wrapper">
            <img id="lightbox-img" src="" alt="放大預覽" oncontextmenu="return false;" draggable="false">
            <!-- 這是用來顯示白色介紹文字的地方 -->
            <p id="lightbox-text" class="lightbox-text"></p>
        </div>
    </div>

    <!-- 這一小段 JavaScript 負責控制點擊放大的魔法 -->
<script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxText = document.getElementById('lightbox-text');
    const images = document.querySelectorAll('.polaroid');
    const closeBtn = document.querySelector('.close-btn');

    // 當點擊小圖時，幫 Lightbox 穿上 'show' 的衣服，觸發淡入魔法！
    images.forEach(img => {
        img.addEventListener('click', function() {
            lightbox.classList.add('show');
            lightboxImg.src = this.src;
            lightboxText.innerText = this.getAttribute('data-text') || ''; 
        });
    });

    // 點擊右上角叉叉，脫掉 'show' 的衣服關閉
    closeBtn.addEventListener('click', function() {
        lightbox.classList.remove('show');
    });

    // 點擊黑色背景任何一處也能關閉
    lightbox.addEventListener('click', function(e) {
        if (e.target !== lightboxImg && e.target !== lightboxText) {
            lightbox.classList.remove('show');
        }
    });
</script>
