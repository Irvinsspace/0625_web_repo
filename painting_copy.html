    <div class="main-container">
        <!-- 這是你的畫廊區塊 -->
        <div class="gallery-grid">
            <!-- 每一張圖都加上 polaroid 類別，以及防右鍵/拖曳屬性 -->
            <img src="圖檔路徑" alt="畫作1" class="polaroid" oncontextmenu="return false;" draggable="false">
            <img src="圖檔路徑" alt="畫作2" class="polaroid" oncontextmenu="return false;" draggable="false">
            <img src="圖檔路徑......(太多了先省略)" alt="畫作6" class="polaroid" oncontextmenu="return false;" draggable="false">

        </div>
    </div>

    <!-- 這是點擊後才會跑出來的「放大預覽區 (Lightbox)」 -->
    <div id="lightbox" class="lightbox">
        <span class="close-btn">&times;</span>
        <img id="lightbox-img" src="" alt="放大預覽" oncontextmenu="return false;" draggable="false">
    </div>

    <!-- 這一小段 JavaScript 負責控制點擊放大的魔法 -->
    <script>
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const images = document.querySelectorAll('.polaroid');
        const closeBtn = document.querySelector('.close-btn');

        // 當點擊小圖時，打開黑底背景並將放大的圖換成該小圖
        images.forEach(img => {
            img.addEventListener('click', function() {
                lightbox.style.display = 'flex';
                lightboxImg.src = this.src;
            });
        });

        // 點擊右上角叉叉，關閉預覽
        closeBtn.addEventListener('click', function() {
            lightbox.style.display = 'none';
        });

        // 點擊黑色背景任何一處，也可以關閉預覽
        lightbox.addEventListener('click', function(e) {
            if (e.target !== lightboxImg) {
                lightbox.style.display = 'none';
            }
        });
    </script>
</body>
